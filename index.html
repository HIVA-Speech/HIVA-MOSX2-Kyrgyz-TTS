<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOS-X2 · Кыргыз TTS</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e2e0db; --acc:#c8102e; --acc-ink:#fff; --sel:#1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#1f1f22; --ink:#f2f2f3; --mute:#a0a0a6; --line:#34343a; --acc:#e8364f; --sel:#f2f2f3; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { max-width:760px; margin:0 auto; padding:16px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:15px; letter-spacing:.02em; }
  .lang button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:4px 10px; border-radius:6px; cursor:pointer; }
  .lang button.on { background:var(--sel); color:var(--bg); }
  main { max-width:760px; margin:0 auto; padding:0 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:22px; margin:0 0 12px; } h2 { font-size:18px; margin:0 0 12px; }
  p { margin:0 0 14px; } .mute { color:var(--mute); font-size:14px; }
  label.row { display:block; margin:0 0 16px; } label.row span { display:block; font-weight:600; margin-bottom:6px; }
  select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  .btn { display:inline-block; border:0; border-radius:8px; padding:12px 20px; font:inherit; font-weight:600; cursor:pointer; background:var(--acc); color:var(--acc-ink); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .bar { height:4px; background:var(--line); border-radius:2px; margin:0 0 16px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--acc); }
  .player { display:flex; gap:10px; align-items:center; margin:8px 0 20px; flex-wrap:wrap; }
  .q { margin:0 0 18px; } .q .t { font-weight:600; margin-bottom:6px; }
  .scale { display:grid; grid-template-columns:repeat(11,1fr); gap:4px; }
  .scale button { padding:8px 0; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; cursor:pointer; }
  .scale button.on { background:var(--sel); color:var(--bg); border-color:var(--sel); }
  .scale button:disabled { opacity:.4; cursor:not-allowed; }
  .ends { display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--mute); margin-top:4px; } .ends span:last-child { text-align:right; }
  .digits { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:360px; }
  .digits button { padding:12px 0; font-size:18px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); cursor:pointer; }
  .digits button.on { background:var(--sel); color:var(--bg); }
  .opts { display:grid; gap:8px; max-width:480px; }
  .opts button { text-align:left; padding:11px 14px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); cursor:pointer; }
  .opts button.on { background:var(--sel); color:var(--bg); border-color:var(--sel); }
  .opts button:disabled { opacity:.4; cursor:not-allowed; }
  .note { font-size:13px; color:var(--acc); min-height:1.2em; }
  .code { font:600 22px ui-monospace,Menlo,monospace; letter-spacing:.08em; }
  @media (max-width:520px) { .card { padding:18px; } .scale button { font-size:12px; padding:7px 0; } }
</style>
</head>
<body>
<header><b id="hdr">MOS-X2</b><div class="lang"><button data-l="ky">KY</button> <button data-l="ru">RU</button></div></header>
<main><div class="card" id="app">…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
